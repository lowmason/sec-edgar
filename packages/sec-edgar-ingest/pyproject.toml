[project]
name = "sec-edgar-ingest"
version = "0.1.0"
description = "Acquire immutable SEC filing-index source snapshots"
readme = "README.md"
authors = [
    { name = "Lowell Mason", email = "mason.lowell@mac.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "azure-identity==1.26.0",
    "azure-storage-blob==12.31.0",
    "azure-data-tables==12.7.0",
]

[project.scripts]
sec-edgar-ingest = "sec_edgar_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
